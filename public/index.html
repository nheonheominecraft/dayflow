<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DayFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080711;--b2:#0C0A19;--sf:#15112A;--el:#211A40;--pr:#7952FF;--sc:#B29AFF;--bd:#403568;--tx:#F5F1FF;--mu:#81789D;--ok:#5EE0A0;--no:#FF6B8B;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px Outfit,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px)}
#app{display:flex;height:100%}
nav{width:196px;background:var(--b2);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;flex:none}
.logo{font-weight:700;letter-spacing:4px;color:var(--sc);padding:4px 10px 16px;font-size:15px}
nav button{display:flex;gap:10px;align-items:center;background:0;border:1px solid transparent;color:var(--mu);padding:9px 10px;font:600 13px Outfit,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;cursor:pointer;text-align:left}
nav button.on{background:var(--el);color:var(--tx);border-color:var(--bd);box-shadow:inset 3px 0 var(--pr)}
nav button:hover{color:var(--tx)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{min-height:48px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--b2)}

#pg{flex:1;overflow:auto;padding:18px}
h1{font-size:24px;font-weight:700}h3{font-size:13px;margin-bottom:10px;color:var(--sc)}
.mu{color:var(--mu);font-size:12px}.g{display:grid;gap:14px;align-content:start}
.dg{grid-template-columns:minmax(0,1fr) 300px}.g2{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);padding:14px;position:relative}
.card:after{content:"";position:absolute;right:-1px;top:-1px;width:7px;height:7px;background:var(--pr)}
.card:before{content:"";position:absolute;left:-1px;bottom:-1px;width:4px;height:4px;background:var(--sc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gr{flex:1;min-width:0}
.btn{background:var(--pr);color:#fff;border:0;padding:8px 14px;font:700 13px Outfit,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;cursor:pointer;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.btn.ghost{background:var(--el);color:var(--sc)}.btn:hover{filter:brightness(1.15)}
.ib{background:0;border:0;color:var(--mu);cursor:pointer;padding:4px 7px;font-size:14px}.ib:hover{color:var(--tx)}
.chip{border:1px solid var(--bd);background:var(--b2);color:var(--sc);padding:3px 9px;font:600 12px Outfit,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.h{color:var(--no)}.m{color:var(--sc)}.l{color:var(--ok)}
input,select,textarea{background:var(--b2);border:1px solid var(--bd);color:var(--tx);padding:8px 10px;font:13px Outfit,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:2px solid var(--pr);outline-offset:-1px}
.row>input,.row>select{width:auto}.row>input.gr{width:0}
input[type=range]{padding:0;accent-color:var(--pr)}textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--mu);margin-top:10px}label input,label select,label textarea{margin-top:4px;color:var(--tx)}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #2a2247}
.it.dn .gr>div:first-child{text-decoration:line-through;color:var(--mu)}
.ck{width:20px;height:20px;border:1px solid var(--sc);background:0;color:#fff;cursor:pointer;flex:none;font-size:12px;line-height:1;padding:0}
.ck.on{background:var(--pr);border-color:var(--pr)}.ck.s{width:15px;height:15px;font-size:10px}
.sub{display:flex;gap:7px;align-items:center;margin-top:5px;font-size:12px;color:var(--mu)}
.sw{width:38px;height:20px;background:var(--b2);border:1px solid var(--bd);position:relative;cursor:pointer;flex:none;padding:0}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--mu)}
.sw.on{background:var(--pr)}.sw.on:after{left:20px;background:#fff}
.li{display:block;width:100%;text-align:left;background:0;border:0;border-left:2px solid transparent;color:var(--mu);padding:7px 8px;font:600 13px Outfit,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;cursor:pointer;margin-top:4px}
.li.on{border-color:var(--pr);color:var(--tx);background:var(--el)}
.bar{height:8px;background:var(--b2);border:1px solid var(--bd)}.bar i{display:block;height:100%;background:var(--pr)}
.ev{font-size:11px;padding:2px 5px;margin-top:3px;border-left:3px solid var(--pr);background:var(--el);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ev.task{border-color:var(--sc)}.ev.deadline{border-color:var(--no)}.ev.class{border-color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cc{background:var(--sf);border:1px solid var(--bd);min-height:84px;padding:4px;cursor:pointer}.cc.t{border-color:var(--pr);box-shadow:inset 0 0 0 1px var(--pr)}
.wk{overflow-x:auto}.wk .cal{min-width:620px}
.tmv{font-size:44px;font-weight:700;letter-spacing:2px}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.md{background:var(--sf);border:1px solid var(--sc);padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--el);border:1px solid var(--sc);padding:9px 16px;z-index:10;font-weight:600}
#cv{height:calc(100vh - 190px);min-height:320px;border:1px solid var(--bd);background:var(--b2);margin-top:10px}#wb{width:100%;height:100%;display:block;touch-action:none}
.msg{padding:9px 12px;margin:6px 0;max-width:88%;border:1px solid var(--bd);background:var(--el)}.msg.u{margin-left:auto;background:var(--pr);border-color:var(--pr)}
.ed{min-height:260px;background:var(--b2);border:1px solid var(--bd);padding:12px;line-height:1.6}
body.cmp .card{padding:9px}body.cmp .it{padding:5px 0}
@media(max-width:800px){#app{flex-direction:column-reverse}
nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.logo{display:none}nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 9px;flex:none}
#pg{padding:12px}.dg,.g2{grid-template-columns:1fr}.cc{min-height:54px}.ev{font-size:9px}.tmv{font-size:38px}
.toast{bottom:90px}.btn,.chip,.ib{min-height:36px}#cv{height:calc(100vh - 330px)}}

/* refinements */
.g,.g2,.g3,.dg{gap:18px}.card{border-radius:14px;padding:20px}.card:before,.card:after{display:none}body.cmp .card{padding:14px}
.row{gap:10px}.btn{clip-path:none;border-radius:9px;padding:10px 16px}.chip{border-radius:8px;padding:6px 12px}.ib{border-radius:8px;padding:6px 9px}
nav{padding:16px 12px;gap:6px}nav button{border-radius:9px;padding:10px 12px}header{padding:8px 20px}#pg{padding:22px}
input,select,textarea{border-radius:8px;padding:10px 12px}input[type=range]{padding:0;touch-action:pan-y}
.it{padding:14px 0}.sub{margin-top:9px}label{margin-top:14px}h3{margin-bottom:14px}
.ck{border-radius:6px}.sw{border-radius:10px}.sw:after{border-radius:50%}.li{border-radius:8px;padding:9px 10px}
.cal{gap:6px}.cc{border-radius:8px;padding:6px}.ev{border-radius:4px;padding:3px 6px;margin-top:4px}.ev.rem{border-color:#FFD166}
.bar{border-radius:6px;overflow:hidden}.md{border-radius:16px;padding:24px}.toast{border-radius:12px}#cv{border-radius:14px;overflow:hidden}.msg{border-radius:12px}.ed{border-radius:10px}
@media(max-width:800px){#pg{padding:14px}nav{padding:6px}nav button{padding:6px 10px}.card{padding:16px}}

/* typography: Outfit */
button,input,select,textarea{font-family:inherit}
h1,.tmv,.logo{font-weight:700}h2,h3{font-weight:600}b,strong{font-weight:600}
.btn,.chip,nav button,.li{font-weight:600}.mu,label,.sub,.ev,.toast{font-weight:500}
input,select,textarea{font-weight:400}

/* AI UI */
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}.dot.w{background:#FFD166}
.chip.cap{cursor:default;background:var(--el);padding:4px 10px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr);gap:10px 14px;margin-top:14px;overflow-wrap:anywhere}
.warnb{margin-top:12px;padding:10px 14px;border:1px solid #FFD166;border-radius:10px;background:var(--b2);color:var(--tx)}
.ml{max-height:220px;overflow:auto;margin-top:6px;border:1px solid var(--bd);border-radius:10px;padding:6px;background:var(--b2)}
button:disabled{opacity:.55;cursor:not-allowed}
.chat{display:flex;flex-direction:column;height:calc(100vh - 130px);min-height:480px}.chm{flex:1;min-height:0;overflow:auto;padding:6px 2px;margin-top:6px}
.cl{max-height:calc(100vh - 300px);overflow:auto}.chh{padding-bottom:14px;border-bottom:1px solid var(--bd)}
.msg{margin:12px 0;padding:12px 16px}.msg.u .mu{color:#ffffffcc}.msg .mb{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.empty{text-align:center;padding:28px 8px}.exg{display:grid;gap:10px;max-width:460px;margin:20px auto}.exg .chip{padding:10px 14px;text-align:left;font-size:13px}
.inp{align-items:flex-end;margin-top:10px;flex-wrap:nowrap}.inp textarea{flex:1;width:0;min-height:44px;max-height:160px;resize:none}
.dots{display:flex;gap:6px;padding:8px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--sc);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.cur{display:inline-block;width:7px;height:14px;background:var(--sc);margin-left:2px;vertical-align:-2px;animation:bl .8s infinite}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
@media(max-width:800px){.chat{height:calc(100vh - 200px);min-height:440px}.cl{max-height:130px}.chh select{max-width:none;flex:1 1 100%}}
main{min-height:0}#pg{min-height:0}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--no)}#syn{cursor:pointer}
</style></head><body><div id="app"><nav id="nv"></nav><main><header><h2 id="ttl"></h2><button class="chip" id="syn" data-a="sync" title="Sync status">Local only</button><button class="btn" data-a="nt">+ Task</button></header><div id="pg"></div></main></div>
<script>

const def=()=>{const w=new Date().getDay();return{set:{name:'Alex',acc:'#7952FF',cmp:false,nt:true,nd:true,nc:true,snd:'Chime',vol:60,q:false,qs:'22:00',qe:'07:00',tone:'concise'},
tasks:[{id:1,t:'Chemistry lab report',p:'high',c:'School',d:iso(1),done:false,subs:[{t:'Collect data',d:true},{t:'Write conclusion',d:false}]},{id:2,t:'Math problem set 7',p:'high',c:'School',d:iso(0),done:false,subs:[]},{id:3,t:'Read History chapter 12',p:'med',c:'School',d:iso(0),done:false,subs:[]},{id:4,t:'Pay club fees',p:'low',c:'Personal',d:iso(-1),done:false,subs:[]},{id:5,t:'Plan weekend trip',p:'low',c:'Personal',d:iso(4),done:false,subs:[]},{id:6,t:'Submit scholarship essay',p:'high',c:'Work',d:iso(6),done:false,subs:[{t:'Draft',d:true},{t:'Proofread',d:false}]},{id:7,t:'Buy lab notebook',p:'low',c:'Personal',d:iso(-2),done:true,subs:[]}],

sess:[1,1,2,3,3,5].map((d,i)=>({task:'Math problem set 7',min:25,at:Date.now()-d*864e5-i*36e5})),

let S,cur,TF={tab:'all',q:'',c:'',p:'',s:'date',gr:'none'},CAL={v:'month',o:0},NS={f:'All',q:'',id:null},T={m:'focus',left:1500,run:false,task:''},tick;
const D={focus:1500,short:300,long:900};
try{S=JSON.parse(localStorage.getItem('dayflow1'))}catch(e){}

modal(id?'Edit task':'New task',fld('mt','Title',t.t)+`<label>Description<textarea id="mds">${esc(t.desc)}</textarea></label>`+fld('md','Due date',t.d,'date')+fld('mtm','Due time (optional)',t.tm,'time')+sel('mp','Priority',['high','med','low'],t.p)+sel('mc','Category',CATS,t.c)+recF('t',t.rec)+sel('mrk','Reminder',RM,t.rm?RM[1]:RM[0])+fld('mrm','Reminder time',t.rm,'time')+`<label>Subtasks (one per line)<textarea id="ms">${esc(t.subs.map(s=>s.t).join('\n'))}</textarea></label>`,()=>{
const v=g('mt').trim();if(!v)return toast('Enter a title'),false;if(!g('md'))return toast('Choose a due date'),false;const rec=readRec('t');if(!rec)return false;const on=g('mrk')==RM[1];if(on&&!g('mrm'))return toast('Choose a reminder time'),false;

/* ---------- recurrence, reminders ---------- */
const RK=[['none','Does not repeat'],['daily','Every day'],['weekday','Every weekday'],['weekly','Every week'],['monthly','Every month'],['custom','Custom weekdays']],PO={high:0,med:1,low:2};
const op=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('');
